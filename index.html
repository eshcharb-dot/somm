<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Somm">
<!-- Without this, iOS Safari's "Add to Home Screen" falls back to a page screenshot instead of
     the wine-glass mark — bad first impression for a PWA whose install prompt is core to the
     pitch. icon-192.png is already opaque (no alpha channel), which apple-touch-icon requires;
     iOS scales it down from 192x192 to the 180x180 it wants. -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#faf7f2">
<title>Somm — your pocket sommelier</title>
<meta name="description" content="Somm — an AI sommelier that learns your palate. What to drink tonight, what to buy, what to order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
</head>
<body>

<!-- ====================== ONBOARDING ====================== -->
<div id="screen-onboarding" hidden>
  <div id="quiz" class="container"></div>
</div>

<!-- ====================== MAIN APP ====================== -->
<div id="screen-main" hidden>
  <main class="container">

    <!-- TONIGHT -->
    <section class="tab" id="tab-tonight">
      <header class="tab-head">
        <h1 class="logo">Somm<span class="accent">.</span></h1>
      </header>
      <h2 id="tonight-greet" class="greet"></h2>
      <form id="tonight-form" class="food-form">
        <input id="tonight-food" class="input" type="text" placeholder="What are you eating? e.g. grilled salmon" autocomplete="off">
        <button class="btn btn-primary" type="submit">Pair it</button>
      </form>
      <div class="quick-row">
        <button class="btn btn-outline" id="btn-surprise">Surprise me</button>
        <button class="btn btn-outline" id="btn-store-picks">Shopping list</button>
      </div>
      <div id="tonight-results"></div>
    </section>

    <!-- SCAN -->
    <section class="tab" id="tab-scan" hidden>
      <header class="tab-head"><h1 class="logo">Scan<span class="accent">.</span></h1></header>

      <div id="scan-ready">
        <p class="greet">Point me at anything wine.</p>
        <div class="scan-grid">
          <button class="scan-tile" onclick="scanWith('bottle')">
            <span class="scan-ico">🍾</span><strong>A bottle</strong><span>Is this one for me?</span>
          </button>
          <button class="scan-tile" onclick="scanWith('shelf')">
            <span class="scan-ico">🛒</span><strong>Store shelf</strong><span>What should I grab?</span>
          </button>
          <button class="scan-tile" onclick="scanWith('list')">
            <span class="scan-ico">📜</span><strong>Wine list</strong><span>What do I order?</span>
          </button>
          <button class="scan-tile" onclick="scanWith('menu')">
            <span class="scan-ico">🍽️</span><strong>Food menu</strong><span>Pair my dinner</span>
          </button>
        </div>
        <div id="scan-recent"></div>
        <!-- "not stored by Somm" alone became misleading once Recent scans started keeping
             photos in this device's localStorage — servers vs device is the honest split. -->
        <p class="muted small center">Photos are analyzed by Claude and never stored on our servers — recent scans stay on this device only. Anthropic's privacy policy applies.</p>
      </div>

      <!-- Two inputs because no single one covers both sources: capture="environment" jumps
           straight to the camera on phones but hides the gallery, while omitting it (the state
           since commit 381331a) leaves many Android pickers with no camera path at all — which
           killed the flagship in-aisle/at-table use case. #src-modal chooses which gets clicked. -->
      <input type="file" id="scan-input" accept="image/*" hidden>
      <input type="file" id="scan-input-camera" accept="image/*" capture="environment" hidden>
    </section>

    <!-- VERA -->
    <section class="tab" id="tab-vera" hidden>
      <div class="vera-tab-inner">
        <header class="tab-head chat-head">
          <h1 class="logo">Vera<span class="accent">.</span></h1>
          <div class="mode-chips">
            <button class="mode-chip" data-mode="tonight" aria-pressed="false">Home</button>
            <button class="mode-chip" data-mode="store" aria-pressed="false">Store</button>
            <button class="mode-chip" data-mode="restaurant" aria-pressed="false">Restaurant</button>
            <button class="mode-chip" data-mode="chat" aria-pressed="false">Anything</button>
          </div>
        </header>
        <!-- aria-live moved OFF #chat-scroll: renderChat() rebuilds the container's entire
             innerHTML, so a live region there made screen readers re-announce the whole
             conversation on every message/chip tap. #chat-live only ever receives the newest
             assistant reply (see announceForScreenReader in app.js). -->
        <div id="chat-scroll"></div>
        <div id="chat-live" class="visually-hidden" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" class="input" type="text" placeholder="Ask Vera anything…" autocomplete="off" inputmode="text">
          <button class="btn btn-primary" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </section>

    <!-- YOU -->
    <section class="tab" id="tab-you" hidden>
      <header class="tab-head"><h1 class="logo">You<span class="accent">.</span></h1></header>
      <div id="you-content"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tonight">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 6v11a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1V9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Tonight</span>
    </button>
    <button class="nav-btn" data-tab="scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      <span>Scan</span>
    </button>
    <button class="nav-btn" data-tab="vera">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.3-2.7A8 8 0 1 1 21 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Vera</span>
    </button>
    <button class="nav-btn" data-tab="you">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>You</span>
    </button>
  </nav>
</div>

<!-- ====================== SCAN RESULT SCREEN ====================== -->
<div id="screen-scan-result" hidden></div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- SCAN SOURCE CHOOSER — camera vs gallery (see js/app.js#openScanSourceChooser) -->
<div id="src-modal" hidden>
  <div class="dlg-overlay" id="src-close"></div>
  <div class="dlg-card" role="dialog" aria-modal="true" aria-label="Add a photo" tabindex="-1">
    <p id="src-title">How do you want to add the photo?</p>
    <div class="src-options">
      <button class="src-option" id="src-camera" type="button">
        <span class="src-ico">📷</span>
        <span class="src-meta"><strong>Take a photo</strong><span>Point the camera at it now</span></span>
      </button>
      <button class="src-option" id="src-gallery" type="button">
        <span class="src-ico">🖼️</span>
        <span class="src-meta"><strong>From gallery</strong><span>Pick a photo you already took</span></span>
      </button>
    </div>
    <div class="dlg-actions">
      <button class="btn-ghost" id="src-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- GENERIC CONFIRM / PROMPT DIALOG (replaces native confirm()/prompt() — see js/app.js#sommConfirm/sommPrompt) -->
<div id="dlg-modal" hidden>
  <div class="dlg-overlay" id="dlg-close"></div>
  <div class="dlg-card" role="alertdialog" aria-modal="true" aria-labelledby="dlg-message" tabindex="-1">
    <p id="dlg-message"></p>
    <div id="dlg-input-wrap" hidden>
      <textarea class="input" id="dlg-input" rows="3"></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn-ghost" id="dlg-cancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="dlg-confirm" type="button">OK</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profile.js"></script>
<script src="js/ai.js"></script>
<script src="js/device.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/somm/sw.js');</script>
</body>
</html>
